<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SaaS Gastronómico</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #fff; --tinta: #1e2430; --muted: #6b7280;
      --borde: #e5e7eb; --acento: #2563eb; --ok: #16a34a; --error: #dc2626;
      --side: #0f172a; --side-tinta: #cbd5e1; --side-activo: #1e293b; --side-hover: #1e293b;
      --sidebar-w: 248px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--tinta);
      font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }

    /* ---------- login ---------- */
    .centro { max-width: 380px; margin: 48px auto; padding: 0 16px; }

    /* ---------- layout app ---------- */
    #app { min-height: 100vh; }
    .layout { display: flex; min-height: 100vh; }

    .sidebar {
      width: var(--sidebar-w); background: var(--side); color: var(--side-tinta);
      display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
      flex-shrink: 0;
    }
    .marca { padding: 18px 18px 14px; border-bottom: 1px solid #1e293b; }
    .marca-empresa { font-size: 16px; font-weight: 700; color: #fff; }
    .marca-sub { font-size: 11px; color: #64748b; letter-spacing: .04em; text-transform: uppercase; }

    #menu { flex: 1; overflow-y: auto; padding: 10px 8px; }
    .menu-grupo { margin-bottom: 2px; }
    .menu-grupo-head {
      width: 100%; display: flex; align-items: center; gap: 10px;
      background: transparent; color: var(--side-tinta); border: 0; cursor: pointer;
      padding: 10px 10px; border-radius: 8px; font-size: 14px; font-weight: 600; text-align: left;
    }
    .menu-grupo-head:hover { background: var(--side-hover); }
    .menu-ico { font-size: 15px; }
    .menu-titulo { flex: 1; }
    .menu-chevron { transition: transform .15s ease; color: #64748b; }
    .menu-grupo.abierto .menu-chevron { transform: rotate(90deg); }
    .menu-items { display: none; padding: 2px 0 6px 34px; }
    .menu-grupo.abierto .menu-items { display: block; }
    .menu-item {
      display: block; width: 100%; text-align: left; background: transparent;
      color: var(--side-tinta); border: 0; cursor: pointer; padding: 7px 10px;
      border-radius: 7px; font-size: 13.5px;
    }
    .menu-item:hover { background: var(--side-hover); color: #fff; }
    .menu-item.activo { background: var(--acento); color: #fff; font-weight: 600; }

    .sidebar-footer { padding: 12px 14px; border-top: 1px solid #1e293b; display: flex; align-items: center; gap: 10px; }
    .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--acento); color: #fff;
      display: grid; place-items: center; font-weight: 700; flex-shrink: 0; }
    .sidebar-footer .datos { flex: 1; min-width: 0; }
    .sidebar-footer .nombre { color: #fff; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sidebar-footer .rol { color: #64748b; font-size: 11px; }
    .icon-btn { background: transparent; border: 0; color: #94a3b8; cursor: pointer; font-size: 18px; padding: 4px; }
    .icon-btn:hover { color: #fff; }

    /* ---------- contenido ---------- */
    .contenido { flex: 1; min-width: 0; }
    .topbar-mobile { display: none; align-items: center; gap: 12px;
      background: var(--card); border-bottom: 1px solid var(--borde); padding: 10px 14px; position: sticky; top: 0; z-index: 5; }
    .topbar-mobile .marca-empresa { color: var(--tinta); font-size: 15px; }
    #btn-menu { background: transparent; border: 0; font-size: 22px; cursor: pointer; color: var(--tinta); }
    .main-inner { max-width: 980px; margin: 0 auto; padding: 22px 18px 40px; }

    /* ---------- overlay mobile ---------- */
    #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 20; }

    /* ---------- componentes ---------- */
    h1 { font-size: 20px; margin: 0; }
    h2 { font-size: 16px; margin: 24px 0 8px; }
    .card { background: var(--card); border: 1px solid var(--borde); border-radius: 12px; padding: 20px; margin-top: 16px; }
    .card:first-child { margin-top: 0; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
    input, select, button { font: inherit; }
    input, select { width: 100%; padding: 9px 11px; border: 1px solid var(--borde); border-radius: 8px; background: #fff; }
    button { cursor: pointer; border: 0; border-radius: 8px; padding: 9px 14px; background: var(--acento); color: #fff; font-weight: 600; }
    button.secundario { background: #eef2ff; color: var(--acento); }
    button.btn-baja { background: #fee2e2; color: var(--error); padding: 5px 10px; font-weight: 500; }
    .fila { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
    .fila > div { flex: 1; min-width: 150px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .muted { color: var(--muted); }
    .error { color: var(--error); }
    [data-tipo="ok"] { color: var(--ok); }
    [data-tipo="error"] { color: var(--error); }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--borde); font-size: 14px; }
    th { color: var(--muted); font-weight: 600; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .msg { margin-top: 10px; font-size: 14px; }
    .tabla-scroll { overflow-x: auto; }

    /* ---------- responsive ---------- */
    @media (max-width: 820px) {
      .topbar-mobile { display: flex; }
      .sidebar { position: fixed; left: 0; top: 0; z-index: 30; transform: translateX(-100%); transition: transform .2s ease; }
      #app.sidebar-abierta .sidebar { transform: translateX(0); }
      #app.sidebar-abierta #overlay { display: block; }
    }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <section id="login" hidden>
    <div class="centro">
      <div class="card">
        <h1>SaaS Gastronómico</h1>
        <p class="muted">Ingresá con tu usuario.</p>
        <form id="form-login">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" autocomplete="username" required />
          <label for="login-pass">Contraseña</label>
          <input id="login-pass" type="password" autocomplete="current-password" required />
          <div style="margin-top:16px;"><button type="submit">Ingresar</button></div>
          <p id="login-msg" class="msg" hidden></p>
        </form>
      </div>
    </div>
  </section>

  <!-- APP -->
  <section id="app" hidden>
    <div id="overlay"></div>
    <div class="layout">

      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="marca">
          <div class="marca-empresa" id="marca-empresa"></div>
          <div class="marca-sub">SaaS Gastronómico</div>
        </div>
        <nav id="menu"></nav>
        <div class="sidebar-footer">
          <div class="avatar" id="avatar">·</div>
          <div class="datos">
            <div class="nombre" id="user-nombre"></div>
            <div class="rol" id="user-rol"></div>
          </div>
          <button class="icon-btn btn-logout" title="Salir">⏻</button>
        </div>
      </aside>

      <!-- Contenido -->
      <div class="contenido">
        <div class="topbar-mobile">
          <button id="btn-menu" aria-label="Menú">☰</button>
          <div class="marca-empresa" id="marca-empresa-top"></div>
        </div>
        <div class="main-inner">
          <div id="screen"></div>
        </div>
      </div>

    </div>
  </section>

  <script type="module" src="./js/saas/ui/app.js"></script>
</body>
</html>
